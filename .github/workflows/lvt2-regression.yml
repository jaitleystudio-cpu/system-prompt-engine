name: SPE LVT-2 Independent Regression Gate

on:
  push:
    branches:
      - 'antigravity/lvt2-evidence-integrity-r1-20261011'
  pull_request:
    branches:
      - 'candidate/2026-10-26'
    paths:
      - 'spe_runtime/research/lvt/**'
      - 'tests/research/lvt/**'
      - '.github/workflows/lvt2-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lvt2-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: LVT learning validity regression
        run: python -m pytest tests/research/lvt -q --tb=short
      - name: Full Python repository regression
        if: success()
        run: python -m pytest tests -q --tb=short
