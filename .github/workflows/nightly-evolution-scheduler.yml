name: SPE Ω Autonomous Maintenance Controller & Daily Watchdog

# NOTE ON GITHUB ACTIONS SCHEDULING BEHAVIOR:
# In GitHub Actions, `schedule` (cron) events are registered and triggered EXCLUSIVELY
# from the repository's default branch (main).
#
# Daily Rhythm (PROPOSAL.md):
# - 02:17 AM IST (20:47 UTC): Discover changes, run specialist jobs, qualify permitted updates.
# - 03:00 AM IST (21:30 UTC): Independently check progress; recover missing or interrupted work.
# - 06:00 AM IST (00:30 UTC): Publish morning truth receipt and health verification.

on:
  schedule:
    # 02:17 AM IST = 20:47 UTC (Primary autonomous maintenance run)
    - cron: '47 20 * * *'
    # 03:00 AM IST = 21:30 UTC (Watchdog recovery for delayed/dropped runs)
    - cron: '30 21 * * *'
    # 06:00 AM IST = 00:30 UTC (Morning receipt publication & health review)
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run simulation mode without staging commits'
        required: false
        default: true
        type: boolean
      watchdog_mode:
        description: 'Run as watchdog recovery check'
        required: false
        default: false
        type: boolean

concurrency:
  group: spe-autonomous-maintenance-controller
  cancel-in-progress: false

jobs:
  autonomous-maintenance:
    name: Autonomous Maintenance Controller & Watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm --prefix apps/web ci

      - name: Check Global Fail-Closed STOP Sentinel
        run: |
          if [ -f .spe_emergency_stop ] || [ "$SPE_EMERGENCY_STOP" = "1" ]; then
            echo "EMERGENCY STOP ACTIVE: Aborting maintenance run."
            exit 1
          fi

      - name: Execute Unified Autonomous Maintenance Controller (8-Stage Loop)
        run: |
          FLAGS="--ci"
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            FLAGS="--run"
          fi
          if [ "${{ inputs.watchdog_mode }}" = "true" ]; then
            FLAGS="--watchdog"
          fi
          node apps/web/scripts/spe-autonomous-maintenance.mjs $FLAGS

      - name: Execute 9-Phase Autonomous Evolution Loop
        run: |
          node apps/web/scripts/nightly-evolution-loop.mjs --ci

      - name: Execute Nightly Intelligence Upgrade & Benchmark Holdouts
        run: |
          node tools/nightly_intelligence_upgrade.mjs

      - name: Verify Web Application Integrity & Bit-for-Bit WASM
        run: |
          node apps/web/scripts/test-autonomous-release-safety.mjs

      - name: Upload Daily Maintenance & Evolution Evidence Receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spe-daily-maintenance-receipts
          path: |
            proofs/generated/DAILY_MAINTENANCE_RECEIPT.json
            proofs/generated/SPE_MAINTENANCE_LEDGER.json
            proofs/generated/NIGHTLY_INTELLIGENCE_UPGRADE_REPORT.json
            proofs/generated/NIGHTLY_EVOLUTION_RUN_RECEIPT.json
          retention-days: 30
