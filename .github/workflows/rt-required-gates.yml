name: rt-required-gates

on:
  push:
    branches:
      - 'grok/rt-vr2-ci-gated-*'
  pull_request:
    branches:
      - grok/rt-abcd-autonomous-20261002
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_SHA: afe1453c515be3b189b27828e20d03d64f80cbdd
  FROZEN_TREE: 46c8bb358aa01d6910ce66668784c43d6b450a86
  WASM_PIN: b707f5eb480adc166f8b5b0df733e742a08a476c89c3f99b90ad63a61c11199b
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  custody:
    name: custody
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert RT custody vs frozen tip
        run: bash scripts/ci/assert-rt-custody.sh

  rt-continuation:
    name: rt-continuation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps (esbuild host)
        working-directory: apps/web
        run: npm ci
      - name: Run task continuation engine suite
        run: node tests/test_task_continuation_engine.mjs

  rt-adversarial-oracles:
    name: rt-adversarial-oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps (esbuild host)
        working-directory: apps/web
        run: npm ci
      - name: Run RT-Q0 adversarial oracles (+ pack coverage)
        run: node tests/test_rt_q0_adversarial_oracles.mjs

  pytest-grounding:
    name: pytest-grounding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust toolchain (spe-core-eval for parity)
        uses: dtolnay/rust-toolchain@stable
      - name: Build spe-core-eval debug binary
        working-directory: portable/spe-core-rs
        run: cargo build --bins
      - name: Install Python package (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run VR1 grounding/k3/quality/portability pytest set
        run: |
          mapfile -t FILES < scripts/ci/rt-vr1-pytest-files.txt
          test -x portable/spe-core-rs/target/debug/spe-core-eval
          python -m pytest -q "${FILES[@]}"

  privacy:
    name: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps
        working-directory: apps/web
        run: npm ci
      - name: Run truth/privacy closure
        run: node apps/web/scripts/test-truth-privacy-closure.mjs

  quality-custody:
    name: quality-custody
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps
        working-directory: apps/web
        run: npm ci
      - name: Run quality runtime custody
        run: node apps/web/scripts/test-quality-runtime-custody.mjs

  wasm-custody:
    name: wasm-custody
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert WASM sha256 pin
        run: bash scripts/ci/assert-wasm-pin.sh

  false-proof:
    name: false-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps (esbuild host)
        working-directory: apps/web
        run: npm ci
      - name: Run VR1 truth fail-closed (M2/M6 + pack oracles)
        run: node tests/test_rt_vr1_truth_fail_closed.mjs
      - name: Assert no LIVE_INDEX/RETRACTION PASS claims in gate scope
        run: bash scripts/ci/assert-no-live-pass-claims.sh

  final-gate:
    name: final-gate
    runs-on: ubuntu-latest
    needs:
      - custody
      - rt-continuation
      - rt-adversarial-oracles
      - pytest-grounding
      - privacy
      - quality-custody
      - wasm-custody
      - false-proof
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Aggregate required job results (fail closed)
        env:
          R_CUSTODY: ${{ needs.custody.result }}
          R_CONT: ${{ needs.rt-continuation.result }}
          R_ORACLES: ${{ needs.rt-adversarial-oracles.result }}
          R_PYTEST: ${{ needs.pytest-grounding.result }}
          R_PRIVACY: ${{ needs.privacy.result }}
          R_QUALITY: ${{ needs.quality-custody.result }}
          R_WASM: ${{ needs.wasm-custody.result }}
          R_FALSE: ${{ needs.false-proof.result }}
        run: |
          bash scripts/ci/assert-final-gate.sh \
            "custody=${R_CUSTODY}" \
            "rt-continuation=${R_CONT}" \
            "rt-adversarial-oracles=${R_ORACLES}" \
            "pytest-grounding=${R_PYTEST}" \
            "privacy=${R_PRIVACY}" \
            "quality-custody=${R_QUALITY}" \
            "wasm-custody=${R_WASM}" \
            "false-proof=${R_FALSE}"
