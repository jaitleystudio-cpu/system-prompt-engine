name: SDD Context Protocol Validation

on:
  push:
    branches:
      - chatgpt/context-protocol-compiler-design-20260924
  pull_request:
    branches:
      - grok/spe-v1-launch-20260924
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: >-
    --remap-path-prefix=/home/runner=/rustc
    --remap-path-prefix=/home=/rustc

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Rust toolchain and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build release WASM artifact
        run: |
          cargo clean --manifest-path portable/spe-wasm/Cargo.toml
          cargo build \
            --manifest-path portable/spe-wasm/Cargo.toml \
            --locked \
            --target wasm32-unknown-unknown \
            --release
      - name: Synchronize public WASM artifact
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
                   from pathlib import Path

          repo = Path.cwd()
          src = repo / "portable/spe-wasm/target/wasm32-unknown-unknown/release/spe_wasm.wasm"
          public_dir = repo / "apps/web/public"
          dest = public_dir / "spe_wasm.wasm"
          meta_path = public_dir / "spe_wasm.sha256.json"

          if not src.is_file() or src.stat().st_size == 0:
              raise SystemExit(f"Missing release artifact: {src}")

          data = src.read_bytes()
          public_dir.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(src, dest)
          meta_path.write_text(json.dumps({
              "algorithm": "SHA-256",
              "sha256": hashlib.sha256(data).hexdigest(),
              "bytes": len(data),
              "source": "portable/spe-wasm/target/wasm32-unknown-unknown/release/spe_wasm.wasm",
              "crate": "spe-wasm",
              "kernel": "spe-core-rs",
              "not_a_release": True,
              "new_implementation": True,
              "network_mode": "NONE",
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Verify WASM target
        run: rustup target list --installed
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: spe-core-rs tests
        working-directory: portable/spe-core-rs
        run: cargo test --all-targets
      - name: spe-wasm tests
        working-directory: portable/spe-wasm
        run: cargo test --all-targets

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Rust toolchain for WASM build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: install
        working-directory: apps/web
        run: npm ci
      - name: clean WASM build outputs
        run: cargo clean --manifest-path portable/spe-wasm/Cargo.toml
      - name: build WASM artifact with remapped paths
        run: cargo build --manifest-path portable/spe-wasm/Cargo.toml --locked --target wasm32-unknown-unknown --release
      - name: verify WASM artifact
        run: test -s portable/spe-wasm/target/wasm32-unknown-unknown/release/spe_wasm.wasm
      - name: engine tests
        working-directory: apps/web
        run: npm run test:engine
      - name: build
        working-directory: apps/web
        run: npm run build
