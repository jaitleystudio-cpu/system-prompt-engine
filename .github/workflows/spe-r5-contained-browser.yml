name: SPE R5 — Constrained Browser Execution

on:
  push:
    branches:
      - chatgpt/spe-r5-contained-browser-ci-20261018
  pull_request:
    branches:
      - chatgpt/spe-r4-replay-receipt-binding-20261018
      - main
    paths:
      - ".github/workflows/spe-r5-contained-browser.yml"
      - "apps/web/security/Dockerfile.spe-r5"
      - "apps/web/scripts/spe-r5-container-attestation.mjs"
      - "apps/web/scripts/test-spe-crash-recovery-browser.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constrained-browser:
    name: Networkless, rootless, bounded Chromium acceptance fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build locked and minimal browser acceptance image
        run: |
          set -euo pipefail
          docker build --file apps/web/security/Dockerfile.spe-r5 \
            --tag spe-r5-boundary:local .
      - name: Assert Docker isolation and rerun earlier acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          run_isolated() {
            docker run --rm --init \
              --user 1000:1000 \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=192 \
              --memory=1024m \
              --memory-swap=1024m \
              --cpus=2 \
              --shm-size=256m \
              --ulimit=core=0 \
              --tmpfs=/tmp:rw,nosuid,nodev,size=256m,mode=1777 \
              --workdir=/opt/spe/apps/web \
              spe-r5-boundary:local node "$@"
          }
          run_isolated scripts/spe-r5-container-attestation.mjs
          run_isolated scripts/test-spe-recovery-interruption.mjs
          run_isolated scripts/test-spe-crash-recovery-browser.mjs
      - name: Verify previously established portability contract
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests/portability/test_browser_recovery_lineage.py -q
      - name: Prevent model-provider calls during security acceptance
        run: |
          test -z "$SPE_ALLOW_MODEL_EXECUTION"
          test -z "$SPE_MODEL_COMMAND_JSON"
