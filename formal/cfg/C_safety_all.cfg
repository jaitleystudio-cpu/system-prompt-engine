\* Full safety bundle (alias of C7 focus)
SPECIFICATION Spec
CONSTANTS
  Lease = {l1, l2}
  Patch = {p1, p2}
  Obl = {o1, o2}
  ProofType = {PT_A, PT_B}
  MaxVersion = 2
INVARIANT TypeOK
INVARIANT SnapshotVersionMonotonic
INVARIANT StalePatchNeverCommits
INVARIANT LeaseBindsBaseSnapshot
INVARIANT OnlyActiveLeaseCommits
INVARIANT RequiredObligationsSatisfied
INVARIANT RequiredProofTypeMatches
INVARIANT FailNeverCommits
INVARIANT UnknownNeverCommits
INVARIANT StateProofAtomicity
INVARIANT FailedCommitNoMutation
INVARIANT LeaseConsumedAfterCommit
INVARIANT NoDoubleCommit
INVARIANT PatchCannotSelfVerify
INVARIANT AllSafety
