<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPE AI Companion</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent-grad: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
      --accent: #00d2ff;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }
    body {
      margin: 0;
      width: 360px;
      height: 480px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 14px 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
    }
    .controls {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .model-selector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }
    select {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 6px;
      outline: none;
      font-size: 12px;
    }
    .search-box {
      width: 100%;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: #fff;
      box-sizing: border-box;
      outline: none;
    }
    .search-box:focus {
      border-color: var(--accent);
    }
    .prompt-list {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.15s;
    }
    .card:hover {
      border-color: var(--accent);
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-tagline {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.3;
    }
    .btn-copy {
      background: var(--accent-grad);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-copy:hover {
      opacity: 0.9;
    }
    footer {
      padding: 10px 16px;
      background: #0b1120;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>⚡ System Prompt Engine</span>
    </div>
    <span class="badge">Shield Active</span>
  </header>

  <div class="controls">
    <div class="model-selector">
      <span>Target Model:</span>
      <select id="model-select">
        <option value="auto">Auto-Detect</option>
        <option value="gpt-4o">OpenAI GPT-4o / o1</option>
        <option value="claude-3-7">Claude 3.7 Sonnet</option>
        <option value="gemini-2-0">Google Gemini 2.0</option>
      </select>
    </div>
    <input type="text" class="search-box" id="search-input" placeholder="Search 1-click power prompts...">
  </div>

  <div class="prompt-list" id="prompt-list"></div>

  <footer>
    <span>SPE v1.0 • 100% Offline Core</span>
    <a href="https://github.com/system-prompt-engine" target="_blank">Open Studio ↗</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
