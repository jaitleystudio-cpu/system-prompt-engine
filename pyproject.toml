[project]
name = "system-prompt-engine"
version = "0.1.0"
description = "System Prompt Engine (SPE) — NEW_IMPLEMENTATION from S0"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["spe_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
